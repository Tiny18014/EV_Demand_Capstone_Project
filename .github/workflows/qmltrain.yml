name: QML Model Train States

on:
  push:
    paths:
      - "src/data/qmldata/states/**"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv cpfinal
          source cpfinal/bin/activate
          pip install -r requirements.txt

      # -------------------------------------------------------
      # STEP 1: Identify all newly added or modified data files
      # -------------------------------------------------------
      - name: Find all changed datasets
        id: changed
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- src/data/qmldata/states/ | grep '\.csv$' || true)
          else
            CHANGED_FILES=$(find src/data/qmldata/states/ -type f -name "*.csv" || true)
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No new or modified dataset files found."
          else
            echo "Detected the following changed data files:"
            echo "$CHANGED_FILES"
          fi

          echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV
          echo "$CHANGED_FILES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # -------------------------------------------------------
      # STEP 2: Preprocess all changed datasets sequentially
      # -------------------------------------------------------
      - name: Run preprocessing for all changed datasets
        if: env.CHANGED_FILES != ''
        run: |
          source cpfinal/bin/activate
          for FILE in $CHANGED_FILES; do
            echo "🔹 Preprocessing $FILE ..."
            python -m src.data.qmlpreprocess "$FILE"
          done

      # -------------------------------------------------------
      # STEP 3: Retrain model on updated data
      # -------------------------------------------------------
      - name: Run retraining script
        if: env.CHANGED_FILES != ''
        run: |
          source cpfinal/bin/activate
          python -m src.model.qmltrain

      # -------------------------------------------------------
      # STEP 4: Commit and push the retrained model + ready data
      # -------------------------------------------------------
      - name: Commit updated model
        if: env.CHANGED_FILES != ''
        run: |
          git config user.name "theboredflamingo"
          git config user.email "stuthi.shrisha@gmail.com"
          git stash --include-untracked
          git pull --rebase origin master
          git stash pop || true
          git add src/model/xgboostqml.joblib src/data/qmldata/ready.csv
          git commit -m "Updated model retrain with new data"
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


