name: QML Model Train DF

on:
  push:
    paths:
     - "src/data/qmldata/**"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv cpfinal
          source cpfinal/bin/activate
          pip install -r requirements.txt

      - name: Run retraining script
        run: |
          source cpfinal/bin/activate
          python -m src.model.trainqml

      - name: Commit updated model
        run: |
          git config user.name "theboredflamingo"
          git config user.email "stuthi.shrisha@gmail.com"
          git stash --include-untracked
          git pull --rebase origin master
          git stash pop || true
          git add src/model/xgboostqml.joblib
          git commit -m "Updated model retrain with new data"
          git push origin master
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

