name: QML Model Train DF

on:
  push:
    paths:
     - "src/data/qmldata/**"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv cpfinal
          source cpfinal/bin/activate
          pip install -r requirements.txt

